<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TL;DR Crawler — Options</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 40px 20px;
    background: #0f1115; color: #e7eaf0;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    max-width: 560px; margin: 0 auto; background: #16181c;
    border: 1px solid rgba(90, 184, 255, .35); border-radius: 14px; padding: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: .12em; color: #ffd166; }
  p.hint { margin: 0 0 22px; color: #98a2b3; font-size: 13px; }
  label { display: block; margin: 16px 0 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #9aa4b2; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,.16); background: #0f1115; color: #e7eaf0;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  input:focus { outline: none; border-color: #5ab8ff; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 22px; }
  button {
    padding: 10px 16px; border-radius: 9px; border: 1px solid rgba(90,184,255,.5);
    background: rgba(90,184,255,.14); color: #cfe8ff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: rgba(90,184,255,.24); }
  #status { color: #ff7ab8; font-size: 13px; }
  .foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08); color: #98a2b3; font-size: 12px; }
  code { color: #5ab8ff; }
</style>
</head>
<body>
  <div class="card">
    <h1>TL;DR CRAWLER</h1>
    <p class="hint">Optional. Without an API key the extension still works — it uses the local fallback summarizer.</p>

    <label for="key">Anthropic API Key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">

    <label for="model">Model name</label>
    <input id="model" type="text" autocomplete="off" spellcheck="false" placeholder="claude-3-5-haiku-latest">

    <div class="row">
      <button id="save">保存设置 / Save</button>
      <button id="clear" type="button">清除 Key / Clear key</button>
      <span id="status" role="status"></span>
    </div>

    <p class="foot">
      The key is stored with <code>chrome.storage.local</code> and is only read by
      <code>background.js</code>, which is the only place that calls the Anthropic API.
    </p>
  </div>
  <script src="options.js"></script>
</body>
</html>
